<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>

    <form>

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required minlength="3">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">

        <label for="student">Are you a student?</label>
        <input type="radio" id="student" name="status" value="student" required>

        <label for="professional">Are you a professional?</label>
        <input type="radio" id="professional" name="status" value="professional">

        <label for="agreement">I agree to the terms</label>
        <input type="checkbox" id="agreement" name="agreement" required>

        <label for="country">Country</label>
        <select id="country" name="country" required>
            <option value="">Select your country</option>
            <option value="jordan">Jordan</option>
            <option value="other">Other</option>
        </select>

        <label for="message">About You</label>
        <textarea id="message" name="message" minlength="10" required></textarea>

        <button type="submit">Register</button>

    </form>

</body>
</html>
